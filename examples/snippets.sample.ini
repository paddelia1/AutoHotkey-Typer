; =====================================================================
;  AHK-Typer - your snippet file                         Version 1.5
;
;  WELCOME! This file starts with EXAMPLE snippets so the app works
;  right away. Try them:
;    ;addr                        anywhere - a postal address
;    ;hi                          in Notepad - a greeting
;    Ctrl + Alt + Shift + S       anywhere - an email signature
;
;  The examples are the snippets named "Ex - ...". When you are ready
;  for your own snippets and secrets, remove them:
;    - all at once:  tray icon > Snippet file > Remove example snippets
;    - one by one:   double-click the tray icon, pick it, Delete
;    - or delete their [Ex - ...] sections below, save, then Reload
;  They contain no real data - nothing is lost by removing them.
;
;  ADD YOUR OWN: double-click the tray icon (Add / edit snippet).
;  That is the easy way; this file is written for you.
;
;  ---- File format, if you edit by hand --------------------------------
;  One [section] per snippet. The section name is the snippet's name.
;    Hotkey=     key combination:  ^ = Ctrl  ! = Alt  + = Shift  # = Win
;                  Example: ^!+e  means  Ctrl + Alt + Shift + E
;    Hotstring=  abbreviation replaced as you type, for example ;em
;    Text=       what gets typed.  \n = new line  \t = Tab  \\ = backslash
;    Secret=     encrypted value (dpapi1:...) - never typed by hand; use
;                  Add / edit snippet with Type: Secret
;    Window=     only active in these windows: part of a title and/or
;                  ahk_exe program.exe. Several: separate with  |
;    Username=   secrets only: typed first, then Tab, then the secret
;    Separator=  Tab (default) or Enter between username and secret
;    Submit=     1 = press Enter after the secret (default 0)
;    Delay=      milliseconds between those steps (default 150)
;    AllowRisky= 1 = silence the hotkey checker's warning (default 0)
;    Enabled=    0 = keep the snippet but switch it off (default 1)
;  The [~AHK-Typer] section, if present, holds app settings (secret lock) -
;  change them from the tray menu, not here.
;  A snippet needs a Hotkey and/or a Hotstring, and a Text or a Secret.
;
;  Text= is plain text. Passwords and keys belong in secrets, which only
;  decrypt under your Windows account on this PC.
; =====================================================================


; ---------------------------------------------------------------------
;  1. Hotstrings - type the abbreviation, it is replaced as you type
; ---------------------------------------------------------------------

[Ex - Email address]
Hotstring=;em
Text=jane.doe@example.com

[Ex - Work email]
Hotstring=;wem
Text=j.doe@company.example

[Ex - Phone number]
Hotstring=;ph
Text=+1 555 0100

[Ex - Quick reply]
Hotstring=;ty
Text=Thank you for your message. I will get back to you shortly.

[Ex - Meeting link]
Hotstring=;meet
Text=https://meet.example.com/jane-doe


; ---------------------------------------------------------------------
;  2. Several lines - \n starts a new line
; ---------------------------------------------------------------------

[Ex - Postal address]
Hotstring=;addr
Text=Jane Doe\n123 Main Street\nSpringfield, ST 00000

[Ex - Email signature]
Hotkey=^!+s
Text=Best regards,\n\nJane Doe\nSenior Data Engineer\nExample Corp


; ---------------------------------------------------------------------
;  3. Hotkeys - Ctrl + Alt + Shift + a letter never clashes with
;     application shortcuts
; ---------------------------------------------------------------------

[Ex - Out of office]
Hotkey=^!+o
Text=I am out of the office until Monday with limited access to email.


; ---------------------------------------------------------------------
;  4. Only in some programs - Window= limits where a snippet works.
;     Several programs: separate them with |
; ---------------------------------------------------------------------

[Ex - Notepad greeting]
Hotstring=;hi
Text=Hello from AHK-Typer!
Window=ahk_exe notepad.exe | ahk_exe notepad++.exe

[Ex - SQL query template]
Hotkey=^!+q
Text=SELECT TOP (100)\n     t.Column1\n    ,t.Column2\nFROM dbo.TableName AS t\nWHERE 1 = 1;
Window=ahk_exe Ssms.exe | ahk_exe Code.exe | ahk_exe azuredatastudio.exe

[Ex - SQL script header]
Hotstring=;sqlh
Text=/*\nScript  : \nCreated : \nVersion : 1.0.0\nPurpose : \n*/\n
Window=ahk_exe Ssms.exe | ahk_exe Code.exe

[Ex - PowerShell header]
Hotstring=;psh
Text=<#\nScript  : \nVersion : 1.0.0\nPurpose : \n#>\n
Window=ahk_exe Code.exe | ahk_exe powershell_ise.exe


; ---------------------------------------------------------------------
;  5. Special characters - \t for Tab, \\ for a backslash
; ---------------------------------------------------------------------

[Ex - Table header row]
Hotstring=;row
Text=Name\tEmail\tPhone

[Ex - Temp folder path]
Hotstring=;tmpd
Text=C:\\Temp\\


; ---------------------------------------------------------------------
;  6. Switched off - Enabled=0 keeps a snippet without loading it
; ---------------------------------------------------------------------

[Ex - Disabled snippet]
Hotstring=;off
Text=You will never see this text.
Enabled=0


; ---------------------------------------------------------------------
;  7. Secrets and logins (cannot be shipped as examples)
;
;  Secrets are encrypted for YOUR Windows account, so no example can be
;  shipped. Create one with Add / edit snippet > Type: Secret.
;  The result looks like this:
;
;  [VPN login]
;  Hotkey=^!+l
;  Username=jdoe
;  Secret=dpapi1:AQAAANCMnd8B...      <- written by the app, never by hand
;  Window=ahk_exe vpnui.exe
;  Submit=1
;
;  One hotkey then types: username, Tab, password, Enter.
; ---------------------------------------------------------------------
