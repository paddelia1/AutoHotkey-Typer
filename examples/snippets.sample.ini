; =====================================================================
;  AHK-Typer - EXAMPLE snippets                        Version 1.4
;
;  These examples show what the app can do. They contain no real data.
;
;  Use them:   tray icon > Snippet file > Example snippets
;  Keep some:  tray icon > Snippet file > Copy examples into my snippets
;              (then edit or delete them in Add / edit snippet)
;
;  This file is replaced every time the app starts - changes made here
;  are lost. Make your own snippets in "My snippets".
;
;  Symbols in hotkeys:  ^ = Ctrl   ! = Alt   + = Shift   # = Win
;  In Text=:            \n = new line   \t = Tab   \\ = one backslash
; =====================================================================


; ---------------------------------------------------------------------
;  1. Hotstrings - type the abbreviation, it is replaced as you type
; ---------------------------------------------------------------------

[Ex - Email address]
Hotstring=;em
Text=jane.doe@example.com

[Ex - Work email]
Hotstring=;wem
Text=j.doe@company.example

[Ex - Phone number]
Hotstring=;ph
Text=+1 555 0100

[Ex - Quick reply]
Hotstring=;ty
Text=Thank you for your message. I will get back to you shortly.

[Ex - Meeting link]
Hotstring=;meet
Text=https://meet.example.com/jane-doe


; ---------------------------------------------------------------------
;  2. Several lines - \n starts a new line
; ---------------------------------------------------------------------

[Ex - Postal address]
Hotstring=;addr
Text=Jane Doe\n123 Main Street\nSpringfield, ST 00000

[Ex - Email signature]
Hotkey=^!+s
Text=Best regards,\n\nJane Doe\nSenior Data Engineer\nExample Corp


; ---------------------------------------------------------------------
;  3. Hotkeys - Ctrl + Alt + Shift + a letter never clashes with
;     application shortcuts
; ---------------------------------------------------------------------

[Ex - Out of office]
Hotkey=^!+o
Text=I am out of the office until Monday with limited access to email.


; ---------------------------------------------------------------------
;  4. Only in some programs - Window= limits where a snippet works.
;     Several programs: separate them with |
; ---------------------------------------------------------------------

[Ex - Notepad greeting]
Hotstring=;hi
Text=Hello from AHK-Typer!
Window=ahk_exe notepad.exe | ahk_exe notepad++.exe

[Ex - SQL query template]
Hotkey=^!+q
Text=SELECT TOP (100)\n     t.Column1\n    ,t.Column2\nFROM dbo.TableName AS t\nWHERE 1 = 1;
Window=ahk_exe Ssms.exe | ahk_exe Code.exe | ahk_exe azuredatastudio.exe

[Ex - SQL script header]
Hotstring=;sqlh
Text=/*\nScript  : \nCreated : \nVersion : 1.0.0\nPurpose : \n*/\n
Window=ahk_exe Ssms.exe | ahk_exe Code.exe

[Ex - PowerShell header]
Hotstring=;psh
Text=<#\nScript  : \nVersion : 1.0.0\nPurpose : \n#>\n
Window=ahk_exe Code.exe | ahk_exe powershell_ise.exe


; ---------------------------------------------------------------------
;  5. Special characters - \t for Tab, \\ for a backslash
; ---------------------------------------------------------------------

[Ex - Table header row]
Hotstring=;row
Text=Name\tEmail\tPhone

[Ex - Temp folder path]
Hotstring=;tmpd
Text=C:\\Temp\\


; ---------------------------------------------------------------------
;  6. Switched off - Enabled=0 keeps a snippet without loading it
; ---------------------------------------------------------------------

[Ex - Disabled snippet]
Hotstring=;off
Text=You will never see this text.
Enabled=0


; ---------------------------------------------------------------------
;  7. Secrets and logins (cannot be shipped as examples)
;
;  Secrets are encrypted for YOUR Windows account, so an example file
;  cannot contain one. Create them in My snippets with
;  Add / edit snippet > Type: Secret. The result looks like this:
;
;  [VPN login]
;  Hotkey=^!+l
;  Username=jdoe
;  Secret=dpapi1:AQAAANCMnd8B...      <- written by the app, never by hand
;  Window=ahk_exe vpnui.exe
;  Submit=1
;
;  One hotkey then types: username, Tab, password, Enter.
; ---------------------------------------------------------------------
